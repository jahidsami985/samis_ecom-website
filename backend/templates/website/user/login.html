{% extends 'web_base.html' %}

{% block title %}Login | samis e Commerce site{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container-fluid">
        <div class="auth-card">
            <p class="store-eyebrow">Welcome back</p>
            <h1>Login</h1>
            <form method="post">
                {% csrf_token %}
                <label for="phone">Phone</label>
                <input id="phone" type="text" name="phone" required autocomplete="username">

                <label for="password">Password</label>
                <input id="password" type="password" name="password" required autocomplete="current-password">

                <button type="submit" class="store-btn store-btn-submit">Login</button>
            </form>
            <p class="auth-link">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
        </div>
    </div>
</section>
{% endblock %}
