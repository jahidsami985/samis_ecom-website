{% extends 'web_base.html' %}

{% block title %}Register | samis e Commerce site{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container-fluid">
        <div class="auth-card">
            <p class="store-eyebrow">Create account</p>
            <h1>Register</h1>
            <form method="post">
                {% csrf_token %}
                <label for="username">Username</label>
                <input id="username" type="text" name="username" required autocomplete="username">

                <label for="email">Email</label>
                <input id="email" type="email" name="email" required autocomplete="email">

                <label for="phone">Phone</label>
                <input id="phone" type="text" name="phone" required autocomplete="tel">

                <label for="date_of_birth">Date of Birth</label>
                <input id="date_of_birth" type="date" name="date_of_birth" required>

                <label for="password">Password</label>
                <input id="password" type="password" name="password" required autocomplete="new-password">

                <button type="submit" class="store-btn store-btn-submit">Create Account</button>
            </form>
            <p class="auth-link">Already have an account? <a href="{% url 'user_login' %}">Login</a></p>
        </div>
    </div>
</section>
{% endblock %}
